; Lodestone.ini - configuration for the Lodestone SKSE framework.
;
; Deployed to Data\SKSE\Plugins\Lodestone.ini the first time the project is
; built, and NEVER overwritten afterwards - your edits survive a rebuild. Read
; once, at game load: changing it means restarting the game.
;
; ALMOST NOTHING IN THIS FILE CHANGES WHAT THE FRAMEWORK DOES. Every key was a
; diagnostic - deciding what gets written to Lodestone.log and nothing else -
; until [WebUI] arrived, and that one is different: it picks between two
; installed backends. It is here anyway rather than in a second file, because a
; mod with two configuration files is worse than a file with one exception in
; it. Keys that change behavior say so in their own comment.
;
; What Lodestone actually does is still driven by the mods that consume it,
; through the Papyrus API in Lodestone.psc. DELETING THIS FILE IS STILL SAFE:
; every key defaults to the behavior you get without it.
;
; SECTIONS ARE ORGANISATIONAL TODAY, NOT ENFORCED. The parser is flat: it reads
; key = value lines and ignores section headers, so a key works wherever it
; sits. The headers are here because this file belongs to the framework rather
; than to one module, and the day a second module needs configuration the
; parser has to learn to scope keys. Writing them now means that day is a
; parser change instead of a migration.

[WebUI]

; WebUIBackend = auto | PrismaUI | MagelightUI | MeridianUI
;
; THIS KEY CHANGES BEHAVIOR - it is the one exception named at the top.
;
; Lodestone can drive a web UI panel through Prisma UI, Magelight UI or Meridian
; UI, and it uses ONE of them per session. None is required: with none
; installed, mods that ask for a panel are told there is none and carry on.
;
;   auto        The default, and what you get with this line removed. Uses
;               Prisma UI if it is installed, otherwise Magelight UI, otherwise
;               Meridian UI.
;   PrismaUI    Use Prisma UI. If it is not installed, no panel - this does
;               NOT fall back, because then it would not be a choice.
;   MagelightUI Use Magelight UI, on the same terms.
;   MeridianUI  Use Meridian UI, on the same terms.
;
; You only need this if you have more than one installed and want a different
; one. The line Lodestone.log writes at startup says which backend won, and
; names the others when there was a choice to make.
WebUIBackend = auto

; WebUIPanicKeys = <scan code> | <scan code>
;
; THIS KEY CHANGES BEHAVIOR, and it is the one you may actually need one day.
;
; A panel that takes keyboard input swallows it while it is focused. If one ever
; gets stuck that way - a broken page, a mod removed mid-save - this chord hands
; control back to the game. Hold both keys together.
;
; It works even while a panel has swallowed everything else, and on all three web
; backends. No mod can turn it off. On Meridian UI the backend checks the chord
; before any panel gets the key. On Prisma UI Lodestone checks it, the panel may
; also see the keypress, and the chord only lets go of panels opened through
; Lodestone - a Prisma panel from a mod that does not use Lodestone is not
; released by it. On Magelight UI no game input sink sees a key while a panel
; holds the keyboard, so Lodestone watches the chord with a small poll of its
; own, only while a panel it opened holds the keyboard and the game window is in
; front; the keypress that gave the panel the keyboard never counts as the chord.
;
; Defaults to Ctrl+Backspace, which is what you get with this line removed.
; Values are DirectInput scan codes, decimal or 0x hex: 0x1D is Left Ctrl, 0x0E
; is Backspace, 0x38 is Left Alt, 0x2A is Left Shift. A value this line does not
; understand is ignored with a warning in Lodestone.log, and the default stays -
; the escape hatch is never left disabled by a typo.
; WebUIPanicKeys = 0x1D | 0x0E

[DetectionRead]

; LogDetectionFilter = 1 writes one line to Lodestone.log for every reading of
; GetHighestDetectionLevelFiltered / GetDetectionObserverCountFiltered: the target,
; the flags, how many candidates were walked, how many were skipped as allies and
; as keyword matches, and the resulting count and level. Defaults to OFF, which is
; what you get with this line removed or set to 0. It changes what is logged and
; nothing else. Read once, at game load.
LogDetectionFilter = 0

[EquipVeto]

; Diagnostics for the equip veto - the module that refuses an item on an actor
; and equips a replacement instead, on behalf of a consumer mod.
;
; Which items are blocked is NOT configured here and cannot be. A consumer
; registers blocks per actor through Lodestone.BlockEquip.

; WatchFaction = <form id in hex> | <plugin file>
; WatchActor   = <form id in hex> | <plugin file>
;
; Who gets a log line for every equip. Repeat either key as needed.
;
; With NEITHER set, logging is thinned - the first 100 calls and then one in
; 25. That thinning is not paranoia: a cell load was measured at 58 calls in
; 7 ms, every NPC in the area dressing itself, and it can bury the one actor
; you are looking at before it does anything.
;
; With EITHER set, a watched actor has EVERY call written, unthinned, and
; everybody else is silenced in the log and still counted in the periodic
; [rate] line.
;
; 0x0005C84D is the vanilla PotentialFollowerFaction - recruitable followers
; sit in it at rank 0, and membership does not leave when they are dismissed.
; A follower from a mod that uses its own faction is not in it; that costs a
; log line and nothing else.
WatchFaction = 0x0005C84D | Skyrim.esm

; Example - pin one actor as well, by reference form id:
; WatchActor = 0x000B9988 | Skyrim.esm

; LogEquipObject = 0 silences the per-call lines and keeps the periodic [rate]
; summary and the refusal lines. Defaults to ON.
;
; Refusals and substitutions are ALWAYS logged, throttled to the first of each
; pair and then every twenty-fifth, and the counters restart after every load
; so the first refusal of a new session is never silent.
LogEquipObject = 1

[SkillMessage]

; LogSkillMessage = 1 writes to Lodestone.log the text built for every
; ShowSkillIncreaseMessage call and the type posted to the HUD. Defaults to OFF,
; which is what you get with this line removed or set to 0. It changes what is
; logged and nothing else. Read once, at game load.
LogSkillMessage = 0

[MagicWrite]

; LogMagicWrite = 1 writes one line to Lodestone.log for every call of CopySpell,
; ClearSpellEffects, AddSpellEffect, SetSpellAutoCalculate, SetSpellCostOverride,
; CopyMagicEffect and CopyMagicEffectAppearance: the target, the source, and how
; many effects the spell holds afterwards. It also logs, on every save load, the
; order of what happens (the restore from the save, the cosave being read, the
; game's active effects being loaded) and each loaded active effect whose spell
; these functions wrote; for that it watches the game's active effect loading,
; which it does not do with this line at 0. Defaults to OFF, which is what you
; get with this line removed or set to 0. Read once, at game load.
LogMagicWrite = 0

[CinematicCamera]

; LogCinematicCamera = 1 adds one line per frame to Lodestone.log while a
; CinematicApproach runs: the frame, the point written and the drift. The line
; that closes each approach (reason, frames, ms, handback) is ALWAYS written and
; is not affected by this key. Defaults to OFF. Read once, at game load.
LogCinematicCamera = 0
